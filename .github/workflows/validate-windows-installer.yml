name: Validate Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release containing the repaired installer
        required: true
        default: v0.1.6
      sha256:
        description: Expected SHA256 of the repaired installer
        required: true

permissions:
  contents: read

jobs:
  install-upgrade-uninstall:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_SHA256: ${{ inputs.sha256 }}
    steps:
      - name: Verify clean install, old uninstaller failure, repaired upgrade and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
          if ($env:EXPECTED_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Invalid SHA256' }
          $version = $env:RELEASE_TAG.Substring(1)
          $work = Join-Path $env:RUNNER_TEMP 'finance-toolbox-nsis-test'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          Set-Location $work
          gh release download v0.1.4 --pattern FinanceToolbox-0.1.4-win-x64.exe --dir .
          if ($LASTEXITCODE -ne 0) { throw 'Old installer download failed' }
          $newName = "FinanceToolbox-$version-win-x64.exe"
          gh release download $env:RELEASE_TAG --pattern $newName --dir .
          if ($LASTEXITCODE -ne 0) { throw 'New installer download failed' }
          if ((Get-FileHash $newName -Algorithm SHA256).Hash -ne $env:EXPECTED_SHA256) { throw 'New installer hash mismatch' }
          $oldInstaller = Join-Path $work 'FinanceToolbox-0.1.4-win-x64.exe'
          $newInstaller = Join-Path $work $newName
          $installDir = Join-Path $work '财务工具箱 NSIS 测试'
          $appExe = Join-Path $installDir '财务工具箱.exe'
          $uninstaller = Join-Path $installDir 'Uninstall 财务工具箱.exe'
          $dataDir = Join-Path $env:APPDATA '财务工具箱\engine'
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          $marker = Join-Path $dataDir 'synthetic-update-preservation.txt'
          Set-Content $marker 'SYNTHETIC DATA: preserve across upgrade and uninstall' -Encoding utf8
          $results = [System.Collections.Generic.List[object]]::new()
          function Invoke-BoundedInstaller([string]$Exe, [string[]]$Arguments, [string]$Label) {
            Write-Host "Running $Label"
            $process = Start-Process -FilePath $Exe -ArgumentList $Arguments -PassThru
            $null = $process.Handle
            if (-not $process.WaitForExit(120000)) {
              taskkill /PID $process.Id /T /F | Out-Null
              throw "$Label timed out"
            }
            if ($null -eq $process.ExitCode) { throw "$Label did not provide an exit code" }
            $exit = [int]$process.ExitCode
            $results.Add(@{ check=$Label; exitCode=$exit })
            Write-Host "$Label exit code: $exit"
            return $exit
          }
          function Assert-Marker {
            if (-not (Test-Path $marker) -or (Get-Content $marker -Raw) -notmatch 'SYNTHETIC DATA') { throw 'User data preservation failed' }
          }
          function Assert-Version([string]$Expected) {
            $entries = @(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.UninstallString -eq ('"' + $uninstaller + '" /currentuser') })
            if ($entries.Count -ne 1 -or $entries[0].DisplayVersion -ne $Expected) { throw "Installed registry version differs from $Expected" }
            if (-not (Test-Path $appExe)) { throw 'Installed executable missing' }
          }
          if ((Invoke-BoundedInstaller $oldInstaller @('/S','/currentuser',"/D=$installDir") 'old-clean-install') -ne 0) { throw 'Old install failed' }
          Assert-Version '0.1.4'
          $badHash = (Get-FileHash $uninstaller -Algorithm SHA256).Hash
          $oldUninstallerCopy = Join-Path $work 'old-uninstaller-test.exe'
          Copy-Item $uninstaller $oldUninstallerCopy
          $badExit = Invoke-BoundedInstaller $oldUninstallerCopy @('/S','/KEEP_APP_DATA','/currentuser','--updated',"_?=$installDir") 'old-uninstaller-reproduction'
          if ($badExit -ne 2) { throw "Expected corrupt old uninstaller exit 2, got $badExit" }
          Assert-Version '0.1.4'
          Assert-Marker
          if ((Invoke-BoundedInstaller $newInstaller @('/S','/currentuser',"/D=$installDir") 'repair-and-upgrade') -ne 0) { throw 'Repair upgrade failed' }
          Assert-Version $version
          Assert-Marker
          $fixedHash = (Get-FileHash $uninstaller -Algorithm SHA256).Hash
          if ($fixedHash -eq $badHash) { throw 'New uninstaller still equals old corrupt file' }
          $fixedUninstallerCopy = Join-Path $work 'fixed-uninstaller-test.exe'
          Copy-Item $uninstaller $fixedUninstallerCopy
          if ((Invoke-BoundedInstaller $fixedUninstallerCopy @('/S','/KEEP_APP_DATA','/currentuser','--updated',"_?=$installDir") 'new-uninstaller') -ne 0) { throw 'New uninstaller failed' }
          if (Test-Path $appExe) { throw 'Application not removed' }
          Assert-Marker
          if ((Invoke-BoundedInstaller $newInstaller @('/S','/currentuser',"/D=$installDir") 'new-clean-install') -ne 0) { throw 'New clean install failed' }
          Assert-Version $version
          Assert-Marker
          if ((Invoke-BoundedInstaller $newInstaller @('/S','/currentuser',"/D=$installDir") 'new-overwrite-install') -ne 0) { throw 'New overwrite install failed' }
          Assert-Version $version
          Assert-Marker
          Copy-Item $uninstaller $fixedUninstallerCopy -Force
          if ((Invoke-BoundedInstaller $fixedUninstallerCopy @('/S','/KEEP_APP_DATA','/currentuser','--updated',"_?=$installDir") 'final-uninstall') -ne 0) { throw 'Final uninstall failed' }
          Assert-Marker
          $report = @{ version=$version; runner='windows-2022'; installerSha256=$env:EXPECTED_SHA256; oldUninstallerSha256=$badHash; newUninstallerSha256=$fixedHash; dataPreserved=$true; checks=$results }
          $report | ConvertTo-Json -Depth 8 | Tee-Object -FilePath validation-result.json
      - name: Upload synthetic validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-validation
          path: ${{ runner.temp }}/finance-toolbox-nsis-test/validation-result.json
          if-no-files-found: warn
          retention-days: 14
